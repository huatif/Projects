namespace: ${app_name}-${env_name}
stacker_bucket: amehan-ent-stacker
stacker_bucket_region: ca-central-1

env_name: ${aws_account}

sys_path: ./
 
 
stacks:
  infra:
    stack_name: ec2-infra
    template_path: templates/infra.yaml
    variables:
      IAMRoleName: ${iam_role_name}    
  ec2-stack:
    stack_name: win-ec2-v2019
    template_path: templates/EC2.yaml
    variables:
      InfraStackName: ${output infra::StackName}
      Hostname: ${hostname}v${app_version}
      InstanceAMI: ${instance_ami}
      InstanceKeyPair: ${ec2_keypair}
     # IAMRoleName: ${iam_role_name}
      InstanceType: ${instance_type}
      IAMS3BucketName: ${ops_bucket_name}
      RootVolumeSize: ${RootVolumeSize}
      AppEnv: ${app_name}