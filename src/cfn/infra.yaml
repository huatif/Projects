

AWSTemplateFormatVersion: '2010-09-09'
Description: Infra Role
 
Parameters:
  IAMRoleName:
    Type: String
    Description: Role Name
Mappings: 
  RegionMap: 
    "us-east-1":
      NAME: Dev
      VPC: vpc-0b3165654d20eb6f3
      PRIVATESUBNET1: subnet-086396cc6e283e6cd
      PRIVATESUBNET2: subnet-07012176d3b948507
      PUBLICSUBNET1: subnet-0a81c8bbd3cb6a18a
      PUBLICSUBNET2: subnet-0f69c9649ed612b67
      AMAZONLINUXAMI: ami-0a887e401f7654935
      SSHSG: sg-0cd03438407b484f0
      RDPSG: sg-04b2dcf92d411181a
      HTTPSG: sg-0c968468c154d1b42
      BUCKETNAME: amehanamehan

    "ca-central-1":
      NAME: Dev
      VPC: vpc-01ed2833ff261ac6f
      DefaultVPC: vpc-c3274eab
      DefaultSubnet: subnet-6ab22d02
      PRIVATESUBNET1: subnet-0ae6f4d92310fb2f3
      PRIVATESUBNET2: subnet-0bdd4d9d1c682c766
      PUBLICSUBNET1: subnet-0ce18660c7f3ce39c
      PUBLICSUBNET2: subnet-0c11ee92821ca1e3d
      AMAZONLINUXAMI: ami-00db12b46ef5ebc36
      SSHSG: sg-
      RDPSG: sg-
      HTTPSG: sg-
      BUCKETNAME: amehan-ent

Resources:
  EC2InstanceProfile:
    Properties:
      Roles:
      - Ref: IAMRoleName
    Type: AWS::IAM::InstanceProfile
  EC2InstanceRole:
    Properties:
      RoleName: !Ref IAMRoleName
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - s3:ListBucket
            Effect: Allow
            Resource:
             - !Sub arn:aws:s3:::amehan-ent
          - Action:
            - s3:GetObject
            Effect: Allow
            Resource:
             - !Sub arn:aws:s3:::amehan-ent/*
          Version: '2012-10-17'
        PolicyName: EC2-S3-Download
      - PolicyDocument:
          Statement:
          - Action:
            - secretsmanager:GetSecretValue
            Effect: Allow
            Resource: 'arn:aws:secretsmanager:ca-central-1:*:secret:Windows/ServiceAccount/DomainJoin*'
          Version: '2012-10-17'
        PolicyName: SecretsManagerGet
    Type: AWS::IAM::Role
    
  ADFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: 
      GroupDescription: !Join
        - ''
        - - 'EC2-'
          - !Ref AWS::StackName
          - ' App sg'
      Tags:
      - Key: Name
        Value: !Join
          - ''
          - - 'ADFS-'
            - !Ref AWS::StackName
      - Key: Project
        Value: Training
      - Key: Application
        Value: ADFS
      VpcId:
        !FindInMap [RegionMap, !Ref "AWS::Region", DefaultVPC]
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: '3389'
        ToPort: '3389'
        CidrIp: 0.0.0.0/0
        Description: Internall Network Access

Outputs:
  
  EC2InstanceProfile:
    Description: Instance Profile name
    Value: !Ref EC2InstanceProfile
    Export: 
      Name: !Sub "${AWS::StackName}-EC2InstanceProfile"

  EC2InstanceRole:
    Description: Instance Role name
    Value: !Ref EC2InstanceRole
    Export: 
      Name: !Sub "${AWS::StackName}-EC2IAMRole"

  ADFSSecurityGroup:
    Description: Instance Role name
    Value: !Ref ADFSSecurityGroup
    Export: 
      Name: !Sub "${AWS::StackName}-ADFSSecurityGroup"
      
  StackName:
    Description: StackName of this stack
    Value: !Ref AWS::StackName