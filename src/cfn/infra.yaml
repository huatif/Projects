Resources:
  EC2InstanceProfile:
    Properties:
      Roles:
      - Ref: EC2InstanceRole
    Type: AWS::IAM::InstanceProfile
  EC2InstanceRole:
    Properties:
      AssumeRolePolicyDocument:
      RoleName: EC2-Role
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - s3:ListBucket
            Effect: Allow
            Resource:
             - !Sub arn:aws:s3:::amehan-ent
          - Action:
            - s3:GetObject
            Effect: Allow
            Resource:
             - !Sub arn:aws:s3:::amahan-ent/*
          Version: '2012-10-17'
        PolicyName: EC2-S3-Download
      - PolicyDocument:
          Statement:
          - Action:
            - secretsmanager:GetSecretValue
            Effect: Allow
            Resource: 'arn:aws:secretsmanager:ca-central-1:*:secret:Windows/ServiceAccount/DomainJoin*'
          Version: '2012-10-17'
        PolicyName: SecretsManagerGet
    Type: AWS::IAM::Role
Outputs:

  StackName:
    Description: StackName of this stack
    Value: !Ref AWS::StackName